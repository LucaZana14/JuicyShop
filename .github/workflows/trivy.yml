name: "Trivy Docker+Image Scan + FileSystem"

on:
  workflow_call:
    inputs:
      image_name:
        description: "Nome dell'immagine Docker da costruire e scansionare"
        required: false
        type: string
        #modificare il nome dell'immagine docker
        default: "bkimminich/juice-shop"
      image_tag:
        description: "Tag dell'immagine Docker"
        required: false
        type: string
        #modificare il tag
        default: "latest-amd64"
      dockerfile_context:
        description: "Contesto di build del Dockerfile"
        required: false
        type: string
        default: "."
      generate_sbom:
        description: "Se true, genera anche la SBOM in formato CycloneDX"
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  run-trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7

      - name: Build dell'immagine Docker
        run: docker build -t ${{ inputs.image_name }}:${{ inputs.image_tag }} ${{ inputs.dockerfile_context }}

      - name: Esegui Trivy (IaC e Dockerfile)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Esegui Trivy (immagine Docker)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: "image"
          image-ref: "${{ inputs.image_name }}:${{ inputs.image_tag }}"
          format: "sarif"
          output: "trivy-results-image.sarif"

      - name: Esegui Trivy (FileSystem)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results-fs.sarif"

      - name: Genera Software Bill of Materials (SBOM)
        if: ${{ inputs.generate_sbom }}
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: "image"
          image-ref: "${{ inputs.image_name }}:${{ inputs.image_tag }}"
          format: "cyclonedx"
          output: "bom.json"

      - name: Genera Report CSV dai SARIF
        if: always()
        run: |
          python3 -c "
          import json, csv, glob

          sarif_files = glob.glob('trivy-results*.sarif')
          for s_file in sarif_files:
              csv_file = s_file.replace('.sarif', '.csv')
              with open(s_file, 'r') as f:
                  sarif = json.load(f)
              
              with open(csv_file, 'w', newline='') as c_file:
                  writer = csv.writer(c_file)
                  writer.writerow(['CVE/Regola', 'Livello', 'Target/File', 'Riga', 'Messaggio'])
                  
                  for run in sarif.get('runs', []):
                      for res in run.get('results', []):
                          rule_id = res.get('ruleId', 'Unknown')
                          level = res.get('level', 'warning').upper()
                          msg = res.get('message', {}).get('text', 'N/D')
                          
                          locs = res.get('locations', [{}])
                          phys_loc = locs[0].get('physicalLocation', {}) if locs else {}
                          file_path = phys_loc.get('artifactLocation', {}).get('uri', 'Sconosciuto')
                          line = phys_loc.get('region', {}).get('startLine', 'N/D')
                          
                          writer.writerow([rule_id, level, file_path, line, msg])
              print(f'CSV generato per {s_file} -> {csv_file}')
          "
      - name: Carica SARIF su GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac
          wait-for-processing: true

      - name: Carica SARIF image su GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-image.sarif
          category: trivy-container
          wait-for-processing: true

      - name: Carica SARIF filesystem su GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-fs.sarif
          category: trivy-fs
          wait-for-processing: true

      - name: Archivia la SBOM come Artefatto
        if: ${{ inputs.generate_sbom }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-reports
          path: |
            trivy-results*.sarif
            trivy-results*.csv
            bom.json
          retention-days: 14
