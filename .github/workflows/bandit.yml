name: Bandit SAST (Python)

on:
  workflow_call:
    inputs:
      scan_path:
        description: "Path da analizzare, relativo alla root del repo"
        required: false
        type: string
        default: "."
      exclude_paths:
        description: "Paths da escludere, separati da virgola"
        required: false
        type: string
        default: "./.git,./node_modules,./venv,./.venv"
      python_version:
        description: "Versione Python da usare per eseguire Bandit"
        required: false
        type: string
        default: "3.x"
      sarif_category:
        description: "Categoria SARIF per distinguere più run sulla stessa repo"
        required: false
        type: string
        default: "sast-bandit"

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Installa Bandit con supporto SARIF
        run: pip install "bandit[sarif]"

      - name: Esegui Bandit
        # non fermiamo la pipeline sui risultati: vogliamo comunque caricare
        # il SARIF su GitHub Security anche se Bandit trova alert (exit code != 0)
        run: |
          bandit -r "${{ inputs.scan_path }}" \
            -f sarif \
            -o results.sarif \
            --exclude "${{ inputs.exclude_paths }}" \
            || true

      - name: Bonifica SARIF (security-severity mancante nel formatter Bandit)
        if: always()
        run: python3 .github/scripts/enhance_bandit_sarif.py results.sarif

      - name: Upload dei risultati SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: ${{ inputs.sarif_category }}
