name: "CodeQL Advanced Security"

on:
  workflow_call:
    inputs:
      languages_matrix:
        description: 'Lista JSON dei linguaggi da analizzare, es. ["python"] o ["python","javascript"]'
        required: false
        type: string
        default: '["python" , "javascript"]'
      queries:
        description: "Query suite da usare"
        required: false
        type: string
        default: "security-extended,security-and-quality"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.languages_matrix) }}

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v7

    - name: Inizializza CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: ${{ inputs.queries }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Esegui l'Analisi CodeQL
      uses: github/codeql-action/analyze@v4
