name: "SonarQube Quality Scan"

#ricordarsi di inserire nei secret il SONAR_TOKEN
on:
  workflow_call:
    inputs:
      sonar_organization:
        description: "Organization SonarCloud"
        required: true
        type: string
      sonar_project_key:
        description: "Project key su SonarCloud"
        required: true
        type: string
      sonar_host_url:
        description: "URL dell'istanza SonarQube/SonarCloud"
        required: false
        type: string
        default: "https://sonarcloud.io"
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonar-scan:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Esegui scansione SonarQube
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        with:
          args: >
            -Dsonar.organization=${{ inputs.sonar_organization }}
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.sources=.
            -Dsonar.python.version=3
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.json,**/*.xml,**/*.css,**/frontend/src/assets/**

      - name: Convert SonarCloud issues to SARIF
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ inputs.sonar_organization }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        run: |
          python3 .github/scripts/sonar_to_sarif.py

          - name: Genera Report CSV
          if: always()
          run: |
            if [ -f sonarcloud.sarif ]; then
              python3 -c "
            import json, csv
            
            with open('sonarcloud.sarif', 'r') as f:
                sarif = json.load(f)
                
            with open('sonarcloud-report.csv', 'w', newline='') as csv_file:
                writer = csv.writer(csv_file)
                # Intestazione personalizzata per i dati di SonarQube
                writer.writerow(['Regola', 'Tipo Sonar', 'Livello', 'File', 'Riga', 'Messaggio'])
                
                for run in sarif.get('runs', []):
                    # Mappiamo le regole per recuperare il 'sonar-type' che hai iniettato nello script
                    rule_map = {}
                    for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                        rule_id = rule.get('id', 'unknown')
                        sonar_type = rule.get('properties', {}).get('sonar-type', 'UNKNOWN')
                        rule_map[rule_id] = sonar_type
  
                    for res in run.get('results', []):
                        rule_id = res.get('ruleId', 'Unknown')
                        level = res.get('level', 'warning').upper()
                        msg = res.get('message', {}).get('text', 'N/D')
                        s_type = rule_map.get(rule_id, 'UNKNOWN')
                        
                        locs = res.get('locations', [{}])
                        phys_loc = locs[0].get('physicalLocation', {}) if locs else {}
                        file_path = phys_loc.get('artifactLocation', {}).get('uri', 'Sconosciuto')
                        line = phys_loc.get('region', {}).get('startLine', 'N/D')
                        
                        writer.writerow([rule_id, s_type, level, file_path, line, msg])
            "
              echo "Report CSV di SonarQube generato con successo!"
            else
              echo "Nessun file SARIF generato, salto la creazione del CSV."
            fi

      - name: Carica i risultati su GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: sonarcloud.sarif

      - name: Salva Report negli Artifatti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-security-reports
          path: |
            sonarcloud.sarif
            sonarcloud-report.csv