name: "Upload to DefectDojo"

on:
  workflow_call:
    inputs:
      dojo_url:
        description: "URL dell'istanza DefectDojo (es. fornito da ngrok)"
        required: true
        type: string
      product_name:
        description: "Nome del prodotto su DefectDojo"
        required: false
        type: string
        default: "JuiceShop"
    secrets:
      DOJO_TOKEN:
        required: true

jobs:
  upload-dojo:
    name: Invia report a DefectDojo
    runs-on: ubuntu-latest

    steps:
      # Il merge-multiple: true unisce tutti i file nella stessa cartella 'security-reports'
      - name: Scarica tutti i report di sicurezza
        uses: actions/download-artifact@v8 
        with:
          path: security-reports
          merge-multiple: true

      - name: Upload dei file SARIF a DefectDojo
        env:
          DOJO_URL: ${{ inputs.dojo_url }}
          DOJO_TOKEN: ${{ secrets.DOJO_TOKEN }}
          PRODUCT_NAME: ${{ inputs.product_name }}
        run: |
          echo "Inizio caricamento su DefectDojo ($DOJO_URL)..."
          
          find security-reports -type f \( -name "*.sarif" -o -name "results.json" \) | while read file; do
            echo "Sto caricando il report: $file"
            
            # Estraiamo il nome del file per usarlo come titolo del test (es. "trivy-results.sarif")
            TEST_TITLE=$(basename "$file")
            
            # ATTENZIONE: Abbiamo cambiato l'endpoint in /api/v2/reimport-scan/
            # e aggiunto il campo test_title=$TEST_TITLE
            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST "$DOJO_URL/api/v2/reimport-scan/" \
              -H "Authorization: Token $DOJO_TOKEN" \
              -F "scan_type=SARIF" \
              -F "test_title=$TEST_TITLE" \
              -F "file=@$file" \
              -F "product_name=$PRODUCT_NAME" \
              -F "product_type_name=Research and Development" \
              -F "engagement_name=Automated CI/CD Scans" \
              -F "auto_create_context=true" \
              -F "close_old_findings=true" \
              -F "deduplication_on_engagement=true")
              
            if [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Successo! Il file $file ha AGGIORNATO la scansione su DefectDojo."
            else
              echo "❌ Errore durante il caricamento di $file (HTTP Status: $HTTP_STATUS)"
              echo "🔍 Dettaglio Errore API:"
              cat response.json
              echo ""
            fi
          done