name: "TruffleHog Secrets Scan"

on:
  workflow_call:

jobs:
  trufflehog:
    name: Ricerca Secret Attivi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 è obbligatorio per analizzare tutta la history dei commit
          fetch-depth: 0
          
      - name: Installazione ed Esecuzione TruffleHog (SARIF)
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          
          echo "Avvio scansione TruffleHog in formato SARIF..."
          # Usiamo il flag --sarif per esportare nel formato standard
          trufflehog filesystem ./ --sarif > trufflehog-results.sarif || true

      - name: Genera Report CSV
        if: always()
        run: |
          if [ -f trufflehog-results.sarif ]; then
            python3 -c "
          import json, csv

          with open('trufflehog-results.sarif', 'r') as f:
              sarif = json.load(f)

          with open('trufflehog-report.csv', 'w', newline='') as csv_file:
              writer = csv.writer(csv_file)
              writer.writerow(['Vulnerabilità/Secret', 'Gravità', 'File', 'Messaggio'])

              for run in sarif.get('runs', []):
                  for res in run.get('results', []):
                      rule_id = res.get('ruleId', 'Unknown')
                      level = res.get('level', 'warning').upper()
                      message = res.get('message', {}).get('text', 'N/D')
                      
                      locs = res.get('locations', [{}])
                      phys_loc = locs[0].get('physicalLocation', {}) if locs else {}
                      file_path = phys_loc.get('artifactLocation', {}).get('uri', 'Sconosciuto')
                      
                      writer.writerow([rule_id, level, file_path, message])
          "
            echo "Report CSV di TruffleHog generato con successo!"
          else
            echo "Nessun file SARIF generato da TruffleHog."
          fi

      - name: Salva Report negli Artifatti
        if: always()
        uses: actions/upload-artifact@v7 
        with:
          name: trufflehog-security-reports
          path: |
            trufflehog-results.sarif
            trufflehog-report.csv