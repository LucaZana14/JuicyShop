name: "TruffleHog Secrets Scan"

on:
  workflow_call:

jobs:
  trufflehog:
    name: Ricerca Secret Attivi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installazione ed Esecuzione TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          echo "Avvio scansione TruffleHog..."
          trufflehog filesystem ./ --json > trufflehog-results.json || true

      # GENERAZIONE CSV DEDICATA A TRUFFLEHOG
      - name: Genera Report CSV
        if: always()
        run: |
          if [ -f trufflehog-results.json ]; then
            python3 -c "
          import json, csv

          findings = []
          with open('trufflehog-results.json', 'r') as f:
              for line in f:
                  line = line.strip()
                  if line:
                      try:
                          findings.append(json.loads(line))
                      except:
                          pass

          with open('trufflehog-report.csv', 'w', newline='') as csv_file:
              writer = csv.writer(csv_file)
              writer.writerow(['Detector/Secret', 'Verificato (Attivo)', 'File', 'Valore Oscurato'])

              for res in findings:
                  detector = res.get('DetectorName', 'Unknown')
                  verified = 'SÌ (CRITICO)' if res.get('Verified') else 'No (Unverified)'
                  
                  # Estrazione del file sorgente dai metadati del filesystem
                  meta = res.get('SourceMetadata', {}).get('Data', {})
                  file_path = meta.get('Filesystem', {}).get('file', 'Sconosciuto')
                  redacted = res.get('Redacted', 'N/D')
                  
                  writer.writerow([detector, verified, file_path, redacted])
          "
            echo "Report CSV di TruffleHog generato con successo!"
          else
            echo "Nessun file JSON generato da TruffleHog."
          fi

      # SALVATAGGIO ARTIFATTI STANDARD
      - name: Salva Report negli Artifatti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-security-reports
          path: |
            trufflehog-results.json
            trufflehog-report.csv