name: "DAST ZAP Scan"

on: workflow_call

jobs:
  zap-scan:
    name: ZAP DAST Scan
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4 

      - name: build dell'immagine docker con cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: juicyshop:local
          cache-from: type=gha
          cache-to: type=gha, mode=max

      # cambia localhost e nome
      - name: Avvio immagine
        run: |
          docker run -d --name juice-app -p 3000:3000 juicyshop:local
          echo "attendo che juice sia online"
          timeout 60s bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 5; done'
          
      - name: Login e Setup Auth Token
        #cambia l'url e le credenziali
        run: |
          echo "Eseguo il login come amministratore..."
          curl -s -X POST "http://localhost:3000/rest/user/login" \
              -H "Content-Type: application/json" \
              -d '{"email": "admin@juice-sh.op", "password": "admin123"}' > risposta.json
          TOKEN=$(jq -r '.authentication.token' risposta.json)
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
              echo "Errore critico: Token non trovato."
              exit 1
          fi
          echo "API_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "Token JWT ottenuto con successo!"

      #cambia nome file yaml e vari urls, cambia anche localhost in openapi
      - name: creazione e configurazione ZAP
        run: |
          cat << EOF > juice-shop-zap.yaml
          env:
            contexts:
              - name: JuiceShop-context
                urls:
                  - http://localhost:3000
                  - http://localhost:3000/#/search
                  - http://localhost:3000/rest/products/search?q=test
          jobs:
            - type: replacer
              rules:
                - description: Auth Token
                  matchType: req_header_str
                  matchString: Authorization
                  replacementString: Bearer \$API_TOKEN
            
            - type: spider
              parameters:
                maxDuration: 2
              
            #- type: openapi
            #  parameters:
            #    apiFile: /zap/wrk/openapi/vAPI.yaml  #Se vuoi cercare il file direttamente da github
            #    targetUrl: http://localhost:8081   #se vuoi vederlo a macchina avviata da docker
            
            - type: passiveScan-config

            - type: activeScan
              parameters: 
                maxScanDurationInMins: 5

            - type: report
              parameters:
                template: sarif-json
                reportDir: /zap/wrk
                reportFile: results.json

            - type: report
              parameters:
                template: traditional-html-plus
                reportDir: /zap/wrk
                reportFile: zap-report.html
          EOF

      - name: Esegui scansione OWASP ZAP (Automation Framework)
        run: |
          docker run --user root --network host --shm-size=2g -v ${{ github.workspace }}:/zap/wrk/:rw -t zaproxy/zap-stable sh -c "Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 & export DISPLAY=:99 && zap.sh -cmd -autorun /zap/wrk/juice-shop-zap.yaml"
          
      - name: Adatta il SARIF per GitHub Code Scanning
        if: always()
        run: |
          if [ -f results.json ]; then
            sudo chown -R $USER:$USER results.json
            python3 .github/scripts/clean_zap_sarif.py
          else
            echo "Attenzione: File results.json non trovato! ZAP potrebbe essere crashato."
          fi

      - name: Genera Report CSV
        if: always()
        run: |
          if [ -f results.json ]; then
            python3 -c "
          import json, csv

          with open('results.json', 'r') as f:
              sarif = json.load(f)
              
          with open('zap-report.csv', 'w', newline='') as csv_file:
              writer = csv.writer(csv_file)
              writer.writerow(['Vulnerabilità', 'Livello', 'URI', 'Messaggio'])
              
              for run in sarif.get('runs', []):
                  for res in run.get('results', []):
                      rule_id = res.get('ruleId', 'Unknown')
                      level = res.get('level', 'warning').upper()
                      msg = res.get('message', {}).get('text', 'N/D')
                      
                      locs = res.get('locations', [{}])
                      phys_loc = locs[0].get('physicalLocation', {}) if locs else {}
                      file_path = phys_loc.get('artifactLocation', {}).get('uri', 'Sconosciuto')
                      
                      writer.writerow([rule_id, level, file_path, msg])
          "
            echo "Report CSV di ZAP generato con successo!"
          else
            echo "File results.json non trovato, salto la creazione del CSV."
          fi

      - name: Upload dei risultati DAST su GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.json
          category: owasp-zap-dast

      - name: Salva Report negli Artifatti
        if: always()
        uses: actions/upload-artifact@v7 
        with:
          name: zap-security-reports
          path: |
            results.json
            zap-report.csv
            zap-report.html