name: "GitLeaks Secret Scanning"

on:
  workflow_call:
    inputs:
      fetch_depth:
        description: "Profondità del checkout (0 = intera history, necessario per trovare secret in commit vecchi)"
        required: false
        type: number
        default: 0
      gitleaks_version:
        description: "Versione di gitleaks da installare"
        required: false
        type: string
        default: "8.30.1"
      config_path:
        description: "Path a un file di config gitleaks custom (vuoto = usa la config di default)"
        required: false
        type: string
        default: ""
      sarif_category:
        description: "Categoria SARIF per distinguere più run sulla stessa repo"
        required: false
        type: string
        default: "gitleaks-secrets"

permissions:
  contents: read

jobs:
  gitleaks:
    name: GitLeaks Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout del codice
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Installa gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks_version }}/gitleaks_${{ inputs.gitleaks_version }}_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Esegui Gitleaks su tutta la repo
        run: |
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path results.sarif \
            --exit-code 0 \
            --verbose

      - name: Pulisci e Potenzia il SARIF e genera Report CSV
        if: always()
        run: |
          if [ -f results.sarif ]; then
            python3 -c "
          import json, csv
          
          with open('results.sarif', 'r') as f:
              sarif = json.load(f)
          
          with open('gitleaks-report.csv', 'w', newline='') as csv_file:
              writer = csv.writer(csv_file)
              writer.writerow(['Tipo di Segreto', 'Gravità', 'File', 'Riga'])

              # NOTA I 4 SPAZI EXTRA QUI SOTTO: ora il ciclo è 'dentro' il file aperto
              for run in sarif.get('runs', []):
                  for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                      rule.setdefault('properties', {})['security-severity'] = '9.0'
                      rule.setdefault('defaultConfiguration', {})['level'] = 'error'
                      if rule.get('name', '').startswith('(?i)'):
                          rule['name'] = 'Generic API Key or Secret'
                          if 'shortDescription' in rule:
                              rule['shortDescription']['text'] = 'Generic API Key or Secret'
                              
                  for res in run.get('results', []):
                      res['level'] = 'error'
                      rule_id = res.get('ruleId', 'Unknown')
                      locs = res.get('locations', [{}])
                      phys_loc = locs[0].get('physicalLocation', {}) if locs else {}
                      file_path = phys_loc.get('artifactLocation', {}).get('uri', 'Sconosciuto')
                      line = phys_loc.get('region', {}).get('startLine', 'N/D')
                      
                      writer.writerow([rule_id, 'ERROR', file_path, line])

          with open('results.sarif', 'w') as f:
              json.dump(sarif, f, indent=2)
          "
            echo "SARIF patchato con successo! Tutti i leak sono ora ERROR CRITICI."
          fi
      - name: Carica i risultati su GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: ${{ inputs.sarif_category }}

      - name: Salva Report negli Artifatti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-security-reports
          path: |
            results.sarif
            gitleaks-report.csv
