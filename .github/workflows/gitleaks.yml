name: "GitLeaks Secret Scanning"

on:
  workflow_call:
    inputs:
      fetch_depth:
        description: "Profondità del checkout (0 = intera history, necessario per trovare secret in commit vecchi)"
        required: false
        type: number
        default: 0
      gitleaks_version:
        description: "Versione di gitleaks da installare"
        required: false
        type: string
        default: "8.30.1"
      config_path:
        description: "Path a un file di config gitleaks custom (vuoto = usa la config di default)"
        required: false
        type: string
        default: ""
      sarif_category:
        description: "Categoria SARIF per distinguere più run sulla stessa repo"
        required: false
        type: string
        default: "gitleaks-secrets"

permissions:
  contents: read

jobs:
  gitleaks:
    name: GitLeaks Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout del codice
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Installa gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks_version }}/gitleaks_${{ inputs.gitleaks_version }}_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Esegui Gitleaks su tutta la repo
        run: |
          # Rimossa la flag --redact per non far accorpare gli alert a GitHub
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path results.sarif \
            --exit-code 0 \
            --verbose

      - name: Pulisci e Potenzia il SARIF (Fix Titoli e Gravità)
        if: always()
        run: |
          if [ -f results.sarif ]; then
            python3 -c "
          import json
          with open('results.sarif', 'r') as f:
              sarif = json.load(f)

          for run in sarif.get('runs', []):
              # 1. Aggiorna le Regole (da qui GitHub legge la gravità reale)
              for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                  # Inietta la severità Critical (9.0) specifica per le API di GitHub
                  rule.setdefault('properties', {})['security-severity'] = '9.0'
                  rule.setdefault('defaultConfiguration', {})['level'] = 'error'
                  
                  # Rinomina la bruttissima Regex in un titolo leggibile
                  if rule.get('name', '').startswith('(?i)'):
                      rule['name'] = 'Generic API Key or Secret'
                      if 'shortDescription' in rule:
                          rule['shortDescription']['text'] = 'Generic API Key or Secret'
                          
              # 2. Aggiorna ogni singolo risultato trovato
              for res in run.get('results', []):
                  res['level'] = 'error'
                  
          with open('results.sarif', 'w') as f:
              json.dump(sarif, f, indent=2)
          "
            echo "SARIF patchato con successo! Tutti i leak sono ora ERROR CRITICI."
          fi
      - name: Carica i risultati su GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: ${{ inputs.sarif_category }}
