name: "Secret Scanning Bake-Off: Gitleaks Official vs Custom"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permette di avviare il bake-off manualmente

permissions:
  contents: read
  security-events: write # Necessario per entrambi per popolare la tab Security

jobs:
  # ==========================================
  # CONTENDENTE 1: Gitleaks (Action Ufficiale)
  # ==========================================
  gitleaks-official:
    name: 🛡️ Gitleaks Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3 
        with:
          fetch-depth: 0 # Profondità totale necessaria per cercare segreti nella history

      - name: Esegui Gitleaks (Action Ufficiale)
        uses: gitleaks/gitleaks-action@v3 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # FONDAMENTALE: Se trova un leak, l'Action di default fallisce (Exit 1). 
        # Mettiamo true per non far "morire" il job e poter vedere l'esito del bake-off.
        continue-on-error: true 

  # ==========================================
  # CONTENDENTE 2: Gitleaks (Workflow Custom)
  # ==========================================
  gitleaks-custom:
    name: 🛠️ Gitleaks Custom
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout del codice
        uses: actions/checkout@v7 # Corretto da v7 a v4
        with:
          fetch-depth: 0

      - name: Installa Gitleaks (Binario Raw)
        run: |
          # Fissiamo una versione stabile, es. 8.18.2
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Esegui Gitleaks su tutta la repo
        run: |
          # detect esce con 0 grazie al flag, in modo da poter processare il SARIF nello step dopo
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path results.sarif \
            --redact \
            --exit-code 0 \
            --verbose

      - name: Debug — quanti leak trovati
        if: always()
        run: |
          if [ -f results.sarif ]; then
            python3 -c "import json; d=json.load(open('results.sarif')); print('Leak trovati:', sum(len(r.get('results', [])) for r in d.get('runs', [])))"
          else
            echo "results.sarif non generato!"
            exit 1
          fi

      - name: Carica SARIF su GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: "gitleaks-custom-run"
          wait-for-processing: true